<!--
  messkabine.html · v1901

  Die Fenstergröße des Browsers wirkt in dieser Umgebung NICHT auf den
  Viewport der Seite — gemessen am 24.09.2026: resize_window auf 390 px
  meldet Erfolg, innerWidth bleibt bei 1920. Responsives Verhalten lässt
  sich so nicht prüfen.

  Was funktioniert, ist ein iframe mit fester Breite. Weil er dieselbe
  Herkunft hat wie die App, kann von außen hineingemessen werden.

  Der Träger muss eine Seite OHNE laufende App sein: sonst läuft die
  Anwendung zweimal, teilt sich localStorage und Service Worker, und man
  misst am Ende die Störung statt die Seite.

  ── v1901 · ZWEI ÄNDERUNGEN ─────────────────────────────────────────────

  (1) DER ZÄHLER HAT PHANTOME GEMELDET.

  Bis v1591 zählte die Klickflächen-Schleife jedes Element, dessen
  `getBoundingClientRect()` eine Fläche von mehr als null ergab. Das ist
  nicht dasselbe wie „wird gemalt": die Haken `#ai-pdf-sec-*` im Reiter
  Pilot-Analyse liegen in einem zugeklappten `<details>`. Chrome überspringt
  dessen Inhalt — **der Kasten bleibt mit 16×16 px stehen, gemalt und
  treffbar ist nichts.** Sie wurden deshalb als „unter 40 px" gemeldet, und
  wer dem Befund folgte, suchte tote Knöpfe, die es nicht gibt.

  **Über `getComputedStyle` ist das nicht zu sehen** — gemessen stehen alle
  zwölf auf `content-visibility: visible`, `visibility: visible`,
  `opacity: 1`, `display: block`. `checkVisibility()` ist das einzige
  Werkzeug, das sie kennt, und es gibt für alle zwölf `false` zurück.
  Jede Schleife hier filtert jetzt darüber — ohne Zusatzoptionen, die
  Begründung steht unten an `gemalt()`.

  **Der Zähler nennt dabei seine Deckung** (`… übersprungen`), statt still
  weniger zu melden. Ein Prüfer, der grün wird, ohne zu sagen wie viel er
  gelesen hat, ist der teure Fehler — derselbe Befund wie beim gold-audit,
  der 6 statt 181 Dateien las und „sauber" meldete.

  (2) EIN HARNESS, DAMIT EINE PRÜFSTRECKE NICHT AM TAB HÄNGT.

  Eine Abnahme über vier Aussehen, neun Reiter und drei Breiten sind rund
  110 Messungen. Ein Renderer-Aufruf je Klick läuft in die Zeitgrenze, und
  ein Harness, der nur im `window` lebt, ist beim nächsten geschlossenen Tab
  weg. Er steht deshalb HIER, in der Datei.

      await DPM.lauf({ breite: 390, layout: 'v1b' })   // ein Aufruf, neun Reiter
      await DPM.lauf({ breite: 390, layout: '' })      // '' = Ansicht "Heute"
      DPM.messe(DPM.ziel().d, DPM.ziel().win, 'Portfolio')

  `layout` ist der Merker `dp_layout`: '' Heute · v1b Aktenmappe ·
  v2 Kanzlei · v2b Tower. Gesetzt wird er VOR dem Laden, und der iframe
  lädt danach ganz neu — nie im laufenden Dokument umschalten, sonst
  hinterlässt der Skin-Wechsel Inline-Variablen und man misst die Störung.

  v2085 · DREI WEITERE ACHSEN (Backlog N60.2)

      await DPM.lauf({ breite: 1180, layout: 'v1b',
                       kartenstil: 'kartei', objkarte: 'datenzeile',
                       theme: 'v2' })

      Merker                gültige Werte
      dp_layout             '' · v1b · v2 · v2b
      dp_karten_stil        '' · zeile · kartei · buetten
      dp_objkarte_stil      '' · bordkarte · kante · datenzeile · ampel ·
                            kennzahlen · minimal
      dp_karten_variante    '' · v1 … v6   (Hell-Fassungen der Karten)

  v2085a · DREI ACHSEN LIEGEN IM JSON `dp_user_settings`, nicht in
  eigenen Schlüsseln. v2085 hatte `theme` auf `dp_karten_variante`
  geschrieben — der erste echte Lauf meldete `angefordert.theme=v2`
  gegen `attribute.theme=null` und hat den Fehler selbst gezeigt.

      ui_theme     '' · kontor · panel · kanzlei · boarding · konsole  (*)
      ui_cards     kompakt · '' · wallet · …                          (*)
      ui_surface   (siehe ui-varianten.js)                             (*)

  (*) v2085b · DIESE DREI UEBERSCHREIBT DER SERVER.
  dp_user_settings ist servergespiegelt: die App laedt die Einstellungen
  nach dem Start und schreibt denselben Schluessel. Vor dem Laden
  gesetzt, sind sie wirkungslos - und zwar lautlos.

  Gemessen am 10.10.2026: theme 'kontor' angefordert, attribute.theme
  blieb null, und im iframe stand "ui_theme": "" - der gesetzte Wert
  war weg, ueberschrieben von der Server-Antwort.

  Wer sie pruefen will, setzt sie NACH dem Laden im iframe:
      var z = DPM.ziel();
      z.win.DealPilotUiVarianten.setze({ ui_theme: 'kontor' });
  und liest danach z.d.documentElement.dataset.uiTheme.

  Dass das Ergebnis die Luecke ZEIGT, ist der Zweck von `attribute`:
  ein Lauf, der theme 'kontor' anfordert und null erhaelt, behauptet
  keine Pruefung, die nicht stattgefunden hat.

  Das JSON wird GEPATCHT, nicht ersetzt — dort stehen auch die
  Nutzerdaten. Wer es überschreibt, löscht Einstellungen, die er
  nicht prüft.

  `undefined` heißt NICHT ANFASSEN — alte Aufrufe bleiben gültig und
  die Wahl des Nutzers unberührt. `''` heißt ausdrücklich abwählen.

  Das Ergebnis trägt `angefordert` UND `attribute`: was gesetzt wurde
  und was am `<html>` wirklich hängt. Ein Merker im Speicher ist kein
  Nachweis — das Modul kann ihn verwerfen (unbekannter Wert) oder an
  eine Bedingung binden (`objektkarten-stil.js` setzt nur bei aktivem
  Layout). Weichen beide ab, steht es im Protokoll.
-->

<script>
(function(){

  var aktuell = null;

  /* ── Was wird GEMALT? ───────────────────────────────────────────────────
     Der Kasten aus getBoundingClientRect() beweist das nicht: in einem
     zugeklappten <details> bleibt er stehen, obwohl Chrome den Inhalt

       checkVisibility({checkOpacity:true})  ->  11 von 230

     > hier lügt. `checkVisibility()` ohne Optionen stützt sich dagegen
     > darauf, ob der Browser das Element überhaupt rendert — und das
     > stimmte an der Stichprobe.

     Die zwölf Haken `#ai-pdf-sec-*` im zugeklappten `<details>` gibt schon
     die Grundform mit `false` zurück (gemessen: alle zwölf, bei
     `getComputedStyle` ständen sie auf `content-visibility: visible`,
     `visibility: visible`, `opacity: 1`, `display: block` und 16×16 px).
     **Die Eigenschaft ist über getComputedStyle gar nicht lesbar** —
     `checkVisibility()` ist das einzige Werkzeug, das sie kennt.

     `contentVisibilityAuto` ändert an der Zahl nichts (gemessen: 0 von

     ── v1901e · UND WARUM DAS ALLEIN NICHT REICHT ──────────────────────

     **Im verborgenen Tab meldet `checkVisibility()` fast alles als
     ungemalt.** Gemessen am 06.10.2026, dasselbe Dokument, dieselbe Stelle:

         Fenster im Vordergrund   1.093 von 7.814 gemalt
         Fenster im Hintergrund       0 von 7.883 gemalt  (später 418)

     Ein Prüfer, der so filtert, findet im Hintergrund **nichts** und meldet
     deshalb auch keinen Fehler. Das ist der teuerste Zustand überhaupt: er
     wird grün, weil er blind ist.

     `gemalt()` prüft deshalb zuerst das, was von der Sichtbarkeit des
     Fensters UNABHÄNGIG ist — Geometrie und ein zugeklapptes `<details>` —
     und zieht `checkVisibility()` nur hinzu, wenn das Dokument wirklich
     angezeigt wird. `DPM.lage()` sagt, welcher Weg gerade gilt, und die
     Anzeige schreibt es dazu. */
  function gemalt(el){
    var r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return false;
    /* Zugeklapptes <details>: der Inhalt wird übersprungen, der Kasten
       bleibt. Das ist auch im Hintergrund eindeutig ablesbar. */
    var det = el.closest ? el.closest('details') : null;
    while (det) {
      if (!det.open) {
        var sum = det.querySelector(':scope > summary');
        if (!(sum && sum.contains(el))) return false;
      }
      det = det.parentElement && det.parentElement.closest ? det.parentElement.closest('details') : null;
    }
    if (el.hasAttribute && el.hasAttribute('hidden')) return false;
    var d = el.ownerDocument;
    if (d && d.hidden) return true;        /* im Hintergrund nur Geometrie */
    if (typeof el.checkVisibility !== 'function') return null;
    try { return el.checkVisibility(); } catch (e) { return null; }
  }

  /* Wie zuverlässig ist diese Messung gerade? */
  function lage(){
    var z = ziel();
    return {
      fensterSichtbar: !document.hidden,
      zielSichtbar: z.d ? !z.d.hidden : null,
      weg: (z.d && z.d.hidden) ? 'nur Geometrie (Fenster im Hintergrund)'
                               : 'Geometrie + checkVisibility()',
      hinweis: (z.d && z.d.hidden)
        ? 'Zeitgeber sind gedrosselt und checkVisibility() meldet im Hintergrund '
          + 'fast alles als ungemalt. Gewartet wird deshalb über MessageChannel, '
          + 'und gefiltert wird nur über Geometrie und <details>. Farbwerte aus '
          + 'getComputedStyle sind hier NICHT verlässlich (eingefrorene Übergänge).'
        : 'voll messbar'
    };
  }

  /* Warten, das die Hintergrund-Drosselung nicht trifft.
     `setTimeout(…, 200)` dauerte im verborgenen Tab gemessen 12.071 ms —
     neun Reiter liefen damit in jede Zeitgrenze. Eine Nachricht über einen
     MessageChannel ist dagegen eine gewöhnliche Aufgabe und wird nicht
     geklemmt; der Ereignislauf bleibt frei, die App kann dazwischen
     rendern. */
  function warte(ms){
    return new Promise(function(fertig){
      var bis = Date.now() + ms;
      var k = new MessageChannel();
      k.port1.onmessage = function(){
        if (Date.now() >= bis) { k.port1.close(); fertig(); }
        else k.port2.postMessage(0);
      };
      k.port2.postMessage(0);
    });
  }

  /* ── Farbe: Text und sein EFFEKTIVER Grund als Paar ────────────────────
     Einzeln ist jede Farbe immer richtig. Gemessen wird der erste Vorfahr
     mit Fläche, und Alpha wird ausgerechnet, nicht geschätzt. */
  /* v1901b · DIE FARBE WIRD GEMALT, NICHT GELESEN.

     Bis v1901a stand hier ein Parser über `String(c).match(/[\d.]+/g)`. Er
     hat 308 angebliche Kontrastfehler im Reiter Bewertung erzeugt, und
     keiner davon war einer. Chrome gibt computed colors heute in CSS Color 4
     zurück:

         color(srgb 0.788235 0.658824 0.298039 / 0.8)

     Das ist Gold #C9A84C bei 80 %. Der Parser las `0.79, 0.66, 0.30` als
     0–255 und machte daraus rgb(1,1,0) — Schwarz. Gegen den Grund
     rgb(42,39,39) ergab das 1,35, und die Tabelle sah im Bericht aus wie
     unlesbar, während sie in Wahrheit goldene Kopfzeilen hat.

     > **Eine Zahlenliste in Klammern sagt nicht, in welcher Einheit sie
     > steht.** Dieselbe Falle wie `marktmieteCold`.

     Statt die Syntaxen nachzubauen (rgb, rgba, color(srgb), oklch, lab …)
     wird die Farbe jetzt auf einen 1×1-Canvas GEMALT und das Pixel gelesen.
     Der Browser normalisiert dabei alles, was er selbst akzeptiert, und die
     Komposition über dem Grund fällt im selben Schritt mit an — kein
     eigenes Alpha-Rechnen mehr. */
  var cvs = document.createElement('canvas');
  cvs.width = cvs.height = 1;
  var ctx = cvs.getContext('2d', { willReadFrequently: true });

  /* v1901d · GEMERKT, SONST LÄUFT DIE PRÜFSTRECKE IN DIE ZEITGRENZE.
     Ein Lauf über neun Reiter malte rund 40.000 Mal auf den Canvas und
     brach nach 45 Sekunden ab. Verschiedene Farben gibt es dabei keine
     hundert — dieselbe Angabe über demselben Grund ergibt immer dasselbe
     Pixel, also wird das Ergebnis gemerkt. */
  var merk = Object.create(null);

  /* Malt `farbe` über `hinter` (ein {r,g,b}) und gibt das Ergebnis zurück.
     Nimmt der Canvas die Angabe nicht an, behält fillStyle den alten Wert —
     daran ist ein Fehlschlag erkennbar, und dann wird null gemeldet statt
     geraten. */
  function male(farbe, hinter){
    var schl = farbe + '|' + hinter.r + ',' + hinter.g + ',' + hinter.b;
    if (schl in merk) return merk[schl];
    return (merk[schl] = male_roh(farbe, hinter));
  }
  function male_roh(farbe, hinter){
    ctx.clearRect(0, 0, 1, 1);
    ctx.fillStyle = 'rgb(' + hinter.r + ',' + hinter.g + ',' + hinter.b + ')';
    ctx.fillRect(0, 0, 1, 1);
    ctx.fillStyle = '#000000';
    ctx.fillStyle = farbe;
    if (ctx.fillStyle === '#000000' && !/^(#000000|black|rgb\(0,\s*0,\s*0\))/i.test(String(farbe).trim())) return null;
    ctx.fillRect(0, 0, 1, 1);
    var p = ctx.getImageData(0, 0, 1, 1).data;
    return { r: p[0], g: p[1], b: p[2], a: 1 };
  }
  /* Ist die Farbe überhaupt sichtbar, also nicht vollständig durchsichtig?
     Über zwei verschiedenen Gründen gemalt: kommt zweimal der Grund heraus,
     ist sie durchsichtig. */
  function deckt(farbe){
    var a = male(farbe, { r:0, g:0, b:0 }), b = male(farbe, { r:255, g:255, b:255 });
    if (!a || !b) return false;
    return !(a.r === 0 && a.g === 0 && a.b === 0 && b.r === 255 && b.g === 255 && b.b === 255);
  }
  /* ══ v1986 · EIN VERLAUF IST AUCH EIN GRUND ═══════════════════════════

     Hier stand nur `backgroundColor`. Gemessen am Abruf-Knopf der
     Datenaufnahme: er traegt `background-color: rgba(0,0,0,0)` und
     `background-image: linear-gradient(#D5BB73, #C9A84C)`. Die alte
     Fassung fiel also auf die Schicht DAHINTER durch (#0c0c0e) und
     meldete Kontrast 1,07 fuer einen Knopf, der bei rund 8:1 liegt.

     In dieser Marke ist das der Normalfall, nicht die Ausnahme: der
     Runway ist die Hausfarbe jeder Handlungsflaeche.

     Ein Verlauf wird ueber seine Farbstopps GEMITTELT. Jeder Stopp
     wird mit `male()` ueber den bereits gesammelten Grund gemalt,
     damit Alpha in den Stopps richtig faellt. Das ist eine Naeherung —
     und sie ist als solche benannt: `quelle` sagt, woher der Grund
     kommt.

     > Ein `url(...)` kann niemand ausrechnen. Dann meldet die Funktion
     > `unmessbar` statt einer Zahl, die nach Messung aussieht. Eine
     > fehlende Messung ist ehrlich, eine falsche ist teuer. */
  function stopps(bild){
    /* Farbstopps aus einem CSS-Verlauf. Keine Prozente, keine Winkel —
       nur die Farben. `color(srgb …)` ist dabei, weil `male()` sie kann
       und der Selbsttest der Kabine genau daran einmal gescheitert ist. */
    var re = /(rgba?\([^)]*\)|color\(\s*srgb[^)]*\)|#[0-9a-fA-F]{3,8}\b|\b(?:transparent|currentcolor)\b)/gi;
    var out = [], m;
    while ((m = re.exec(bild))) out.push(m[1]);
    return out;
  }
  /* v1988 · Die Ebenen eines `background-image` trennen. Kommas auf
     Klammertiefe 0 sind Ebenengrenzen, alle anderen gehoeren zu einer
     Farbe oder einer Positionsangabe. */
  function ebenenTrennen(bild){
    var out = [], tief = 0, start = 0;
    for (var i = 0; i < bild.length; i++) {
      var c = bild[i];
      if (c === '(') tief++;
      else if (c === ')') tief--;
      else if (c === ',' && tief === 0) { out.push(bild.slice(start, i)); start = i + 1; }
    }
    out.push(bild.slice(start));
    return out.map(function (x) { return x.trim(); }).filter(Boolean);
  }
  /* ═══ v2065 · EIN PSEUDOELEMENT KANN DER ECHTE GRUND SEIN ═══════════
     Gemessen am 09.10.2026 an den Score-Ringen im Cockpit: `div.sc`
     trägt `conic-gradient(rgb(169,141,64) 65%, …)` — den Ring. Die Zahl
     darauf hat DIESELBE Goldfarbe, und die Kabine meldete Kontrast 1,7.

     Sie stand damit unter den drei schwersten Befunden der ganzen App.

     Nur: `div.sc::before` legt einen WEISSEN Kern (33×33 px, inset 3,5,
     border-radius 50%), und die Zahl (13×13) steht darauf — nicht auf
     dem Gold. Der echte Kontrast ist rund 3,1.

     > Ein Pseudoelement findet kein DOM-Werkzeug. `getComputedStyle(el,
     > '::before')` findet es doch — man muss nur daran denken, dass es
     > den Grund stellen kann.

     Gefasst wird der häufige Fall: ein Pseudoelement mit deckender
     Hintergrundfarbe und `inset`, das den Textbereich überdeckt. Alles
     andere (Verläufe im Pseudoelement, berechnete Positionen) bleibt
     ungefasst und wird als solches gemeldet. */

  /* ── Harness: EIN Aufruf je Aussehen und Breite ───────────────────────── */

  /* ══ v1984 · STANDBILD ═══════════════════════════════════════════════

     Warum INLINE und nicht ein Blatt: `style.css` setzt

         body #sidebar.sidebar{ … transition:transform .26s … !important }

     Das ist Spezifitaet (1,1,1) mit `!important`. Ein Blatt mit `*`
     ist (0,0,0) — es verliert, obwohl es ebenfalls `!important`
     traegt. Gemessen am 08.10.2026: mit dem Blatt blieb der Uebergang
     bei 0.26s und die Schublade bei x=-357; inline sprang sie auf x=0.

     Inline-`!important` steht ueber jeder Autoren-Regel, auch ueber
     einer wichtigen. Das ist die einzige Stufe, die hier reicht.

     Pseudoelemente haben kein style-Attribut. Fuer die bleibt nur ein
     Blatt, und das traegt deshalb absichtlich eine hohe Spezifitaet.

     > Gemerkt wird, welche Elemente VORHER keinen Inline-Wert hatten.
     > Nur die werden beim Abschalten geleert. Ein Messmittel, das
     > Spuren hinterlaesst, misst beim naechsten Mal sich selbst. */
  var SB_AN = true;              /* Vorgabe: Standbild ein */
  var sbBeobachter = null;
  var SB_BLATT_ID = 'dpm-standbild';

  function sbElementStill(el){
    if (!el || !el.style) return 0;
    if (el.dataset && el.dataset.dpmSb === '1') return 0;
    try {
      var vorherT = el.style.getPropertyValue('transition');
      var vorherA = el.style.getPropertyValue('animation');
      el.setAttribute('data-dpm-sb', '1');
      el.setAttribute('data-dpm-sb-alt', (vorherT ? 't' : '') + (vorherA ? 'a' : ''));
      el.style.setProperty('transition', 'none', 'important');
      el.style.setProperty('animation', 'none', 'important');
      return 1;
    } catch (e) { return 0; }
  }

  function standbild(an){
    SB_AN = !!an;
    var z = ziel();
    if (!z.d || !z.d.body) return { fehler: 'kein Dokument' };
    var d = z.d;
    if (sbBeobachter) { sbBeobachter.disconnect(); sbBeobachter = null; }
    var altesBlatt = d.getElementById(SB_BLATT_ID);
    if (altesBlatt) altesBlatt.remove();

    if (!SB_AN) {
      /* zurueckdrehen - nur was wir selbst gesetzt haben */
      var auf = 0;
      [].forEach.call(d.querySelectorAll('[data-dpm-sb]'), function(el){
        var alt = el.getAttribute('data-dpm-sb-alt') || '';
        if (alt.indexOf('t') < 0) el.style.removeProperty('transition');
        if (alt.indexOf('a') < 0) el.style.removeProperty('animation');
        el.removeAttribute('data-dpm-sb');
        el.removeAttribute('data-dpm-sb-alt');
        auf++;
      });
      sichtNachziehen();
      return { standbild: false, zurueckgedreht: auf };
    }

    /* Blatt NUR fuer Pseudoelemente - hohe Spezifitaet, damit es nicht
       dasselbe Schicksal erleidet wie das alte `*`-Messblatt. */
    var st = d.createElement('style');
    st.id = SB_BLATT_ID;
    st.textContent = 'html body *::before,html body *::after,'
      + 'html body *::first-line,html body *::marker'
      + '{transition:none !important;animation:none !important}';
    d.head.appendChild(st);

    var n = 0;
    n += sbElementStill(d.documentElement);
    n += sbElementStill(d.body);
    [].forEach.call(d.querySelectorAll('*'), function(el){ n += sbElementStill(el); });

    /* Was die App SPAETER baut, bekommt es auch. Die Objektliste baut
       sich bei jeder Sortierung komplett neu - ohne diesen Beobachter
       waere genau die Flaeche wieder animiert, die gemessen wird. */
    try {
      sbBeobachter = new z.win.MutationObserver(function(liste){
        if (!SB_AN) return;
        for (var i = 0; i < liste.length; i++) {
          var hinzu = liste[i].addedNodes || [];
          for (var j = 0; j < hinzu.length; j++) {
            var k = hinzu[j];
            if (!k || k.nodeType !== 1) continue;
            sbElementStill(k);
            if (k.querySelectorAll) [].forEach.call(k.querySelectorAll('*'), sbElementStill);
          }
        }
      });
      sbBeobachter.observe(d.documentElement, { childList: true, subtree: true });
    } catch (e) {}

    /* Ein Umbruch erzwingen, damit die Zielwerte sofort gelten */
    void d.documentElement.offsetHeight;
    sichtNachziehen();
    return { standbild: true, elemente: n, beobachter: !!sbBeobachter };
  }

  /* ══ v1986 · rAF FEUERT IM VERBORGENEN DOKUMENT NICHT ════════════════

     GEMESSEN mit einer Frist von 1200 ms: in der Kabine UND im
     Pruefling kommt kein rAF-Rueckruf, solange das Browserfenster
     nicht vorn liegt.

     Das ist nicht kosmetisch. `object-actions.js` baut die
     Pre-Flight-Karte auf dem Handy erst dann zum Bodenblatt um, wenn
     ein MutationObserver `scan()` ruft — und der tut das in einem rAF.
     Ohne rAF entsteht kein `.dp-pf-mtrigger`, das Blatt bleibt per
     `translateY(110%)` unter dem Bildrand, und die Kabine zeigt eine
     Datenaufnahme, die es auf einem echten Geraet so nie gibt.

     > Ich habe das beinahe als Produktfehler gemeldet. Entschieden hat
     > es eine rAF-Frist, nicht eine plausible Erklaerung. */
  function rafErsatz(){
    var z = ziel();
    if (!z.win) return { fehler: 'kein Fenster' };
    if (z.win.__dpmRafEcht) return { schon: true };
    try {
      z.win.__dpmRafEcht = z.win.requestAnimationFrame.bind(z.win);
      z.win.requestAnimationFrame = function (cb) {
        return z.win.setTimeout(function () { cb(z.win.performance.now()); }, 16);
      };
      return { umgelegt: true };
    } catch (e) { return { fehler: e.message }; }
  }

  /* Eine Probe, die den Ersatz MESSBAR macht: feuert rAF jetzt? */
  async function rafProbe(){
    var z = ziel();
    if (!z.win) return ['kein Fenster'];
    var kam = await new Promise(function (res) {
      var da = false;
      try { z.win.requestAnimationFrame(function () { da = true; res(true); }); }
      catch (e) { res(false); return; }
      setTimeout(function () { if (!da) res(false); }, 1200);
    });
    return [(kam ? 'ok   ' : 'FEHL ') + 'rAF im Pruefling feuert: ' + kam
            + '  (Sichtbarkeit ' + ((ziel().d && ziel().d.visibilityState) || '?') + ', Ersatz '
            + (z.win.__dpmRafEcht ? 'aktiv' : 'aus') + ')'];
  }

  /* Die Sichtbarkeit des Prueflings gehoert IN DIE KABINE, nicht in den
     Kopf des Messenden: sie ist „hidden", solange das Browserfenster
     nicht vorn liegt, und dann laeuft kein Uebergang von selbst. */
  function sichtNachziehen(){
    var e = document.getElementById('sicht');
     if (!e) return;
    var z = ziel();
    var v = (z.d && z.d.visibilityState) || '?';
    var raf = false;
    try { raf = !!(ziel().win && ziel().win.__dpmRafEcht); } catch (x) {}
    e.textContent = 'Sichtbarkeit: ' + v + ' · Standbild: ' + (SB_AN ? 'ein' : 'aus')
      + ' · rAF-Ersatz: ' + (raf ? 'aktiv' : 'aus');
    e.className = 'hin ' + (SB_AN ? 'ok' : (v === 'visible' ? 'leise' : 'warn'));
  }

  /* Eine Gegenprobe, die den Zweck des Schalters MESSBAR macht: eine
     Flaeche mit Uebergang suchen und nachsehen, ob er wirklich still
     ist. Ohne das waere „Standbild: ein" nur eine Behauptung. */
  function standbildProbe(){
    var z = ziel();
    if (!z.d || !z.win) return ['kein Dokument'];
    var out = [], laufen = 0, geprueft = 0;
    var els = [].slice.call(z.d.querySelectorAll('*')).slice(0, 1200);
    for (var i = 0; i < els.length; i++) {
      var cs = z.win.getComputedStyle(els[i]);
      var t = cs.transitionDuration || '', a = cs.animationName || '';
      geprueft++;
      var tLaeuft = t && t.split(',').some(function(x){ return parseFloat(x) > 0; });
      var aLaeuft = a && a !== 'none';
      if (tLaeuft || aLaeuft) {
        laufen++;
        if (out.length < 6) out.push(nam(els[i]) + '  dauer=' + t + '  anim=' + a);
      }
    }
    return [(laufen === 0 ? 'ok   ' : 'FEHL ') + 'noch bewegt: ' + laufen
            + ' von ' + geprueft + ' Elementen  (Standbild ' + (SB_AN ? 'ein' : 'aus') + ')']
           .concat(out);
  }

  /* ── v2085 · VIER VARIANTENACHSEN, NICHT NUR DAS LAYOUT ───────────────
   *
   * Backlog N60.2 fordert den Lauf über „mindestens 3 Gestaltungs-
   * varianten". Gemessen konnte die Kabine nur EINE setzen: `dp_layout`.
   * Kartenstil und Theme waren über sie nicht ansteuerbar — die

   * `data-dp-kartenstil`, `hell-varianten.js:43` liest
   * `data-ui-theme`), aber die Kabine kannte ihre Merker nicht.
   *
   * > Ein Prüfstand, der eine Achse nicht verstellen kann, prüft sie
   * > nicht — und meldet trotzdem „geprüft". Genau das hat N60.17
   * > getan: vier Ansichten protokolliert, alle beim Standard-Design.
   *
   * Die vier Merker, aus den Modulen abgeschrieben, nicht geraten:
   *
   *   dp_layout           layout-varianten.js:63    '' v1b v2 v2b
   *   dp_karten_stil      karten-stil.js:66         '' zeile kartei buetten
   *   dp_objkarte_stil    objektkarten-stil.js:43   '' bordkarte kante
   *                                                 datenzeile ampel
   *                                                 kennzahlen minimal
   *   dp_karten_variante  hell-varianten.js:28      '' v1 … v6
   *
   * `undefined` heißt „nicht anfassen" — so bleiben alte Aufrufe
   * (`lauf({breite, layout})`) unverändert gültig. `''` heißt
   * ausdrücklich „abwählen" und entfernt den Merker.
   */
  var MERKER = {
    layout:         'dp_layout',
    kartenstil:     'dp_karten_stil',
    objkarte:       'dp_objkarte_stil',
    kartenvariante: 'dp_karten_variante'
  };

  function setzeEinen(schluessel, wert){
    try {
      if (wert === '' || wert === null) window.localStorage.removeItem(schluessel);
      else window.localStorage.setItem(schluessel, wert);
    } catch (e) {}
  }

  /* ── v2085a · DAS THEME LIEGT IM JSON, NICHT IN EINEM EIGENEN SCHLUESSEL
   *
   * v2085 hat `theme` auf `dp_karten_variante` geschrieben und die Werte
   * `v1…v6` dokumentiert. Der erste echte Lauf hat gezeigt, dass das
   * falsch war — und zwar durch das Feld, das genau dafuer eingebaut
   * wurde:
   *
   *     angefordert: { theme: 'v2' }
   *     attribute:   { theme: null }      <- kam nicht an
   *
   * Gemessen: `data-ui-theme` setzt `ui-varianten.js:217` aus dem Feld
   * `ui_theme` in **`localStorage['dp_user_settings']`** (einem JSON),
   * und die gueltigen Werte sind
   *
   *     '' · kontor · panel · kanzlei · boarding · konsole
   *
   * `dp_karten_variante` mit `v1…v6` ist etwas ANDERES: die Hell-
   * Fassungen der Karten (`hell-varianten.js`). Zwei Begriffe, zwei
   * Speicher, ein verwechselter Name.
   *
   * > Ein Merker, den man setzt, ohne das Attribut nachzusehen, ist eine
   * > Behauptung. Der Lauf hat meinen eigenen Fehler in der ersten
   * > Messung gemeldet — deshalb bleibt `attribute` im Ergebnis, auch
   * > wenn jetzt alles ankommt.
   *
   * Das JSON wird GEPATCHT, nicht ersetzt: in `dp_user_settings` stehen
   * auch `ui_cards`, `ui_surface`, `ui_form` und die Nutzerdaten. Wer es
   * ueberschreibt, loescht Einstellungen, die er nicht prueft.
   */
  /* ── v2085b · DIESE DREI ACHSEN UEBERSCHREIBT DER SERVER ─────────────
   *
   * ZWEITER Fehlversuch am Theme, deshalb Diagnose statt Nachbessern.
   * Gemessen IM iframe, nach einem Lauf mit `theme: 'kontor'`:
   *
   *     localStorage['dp_user_settings'] -> { … "ui_theme": "" … }
   *
   * Der gesetzte Wert war weg. `dp_user_settings` ist **servergespiegelt**:
   * die App laedt die Einstellungen nach dem Start vom Server und
   * schreibt sie in denselben Schluessel. Die anderen vier Merker
   * (`dp_layout`, `dp_karten_stil`, `dp_objkarte_stil`,
   * `dp_karten_variante`) sind rein lokal - deshalb kommen die an und
   * diese drei nicht.
   *
   * > Vor dem Laden zu setzen ist bei einem servergespiegelten Wert
   * > wirkungslos, und zwar lautlos: der Merker steht da, bis die
   * > Antwort kommt.
   *
   * Es BLEIBT hier, weil es ohne Server-Antwort (Abruf scheitert, offline)
   * trotzdem greift - aber es ist kein verlaesslicher Weg. Wer diese drei
   * Achsen prueefen will, setzt sie NACH dem Laden ueber die Modul-API im
   * iframe und liest danach das Attribut:
   *
   *     var z = DPM.ziel();
   *     z.win.DealPilotUiVarianten.setze({ ui_theme: 'kontor' });
   *     // dann erst messen
   *
   * Dass `attribute` die Luecke zeigt, ist der Zweck des Feldes: ein
   * Lauf, der `theme: 'kontor'` anfordert und `theme: null` erhaelt,
   * behauptet keine Pruefung, die nicht stattgefunden hat.
   */
  function setzeJsonFeld(feld, wert){
    try {
      var s = {};
      try { s = JSON.parse(window.localStorage.getItem('dp_user_settings') || '{}') || {}; }
      catch (e) { s = {}; }
      if (wert === '' || wert === null) delete s[feld];
      else s[feld] = wert;
      window.localStorage.setItem('dp_user_settings', JSON.stringify(s));
    } catch (e) {}
  }

  function setzeMerker(layout, extra){
    setzeEinen(MERKER.layout, layout);
    try { window.localStorage.setItem('dp_layout_gewaehlt', '1'); } catch (e) {}
    if (!extra) return;
    /* Nur was ausdrücklich genannt ist. `undefined` laesst den Merker
       in Ruhe - sonst wuerde jeder Lauf die Wahl des Nutzers loeschen. */
    if (extra.kartenstil !== undefined) setzeEinen(MERKER.kartenstil, extra.kartenstil);
    if (extra.objkarte   !== undefined) setzeEinen(MERKER.objkarte,   extra.objkarte);
    if (extra.kartenvariante !== undefined) {
      setzeEinen(MERKER.kartenvariante, extra.kartenvariante);
      /* hell-varianten.js zeigt sich nur mit gesetztem Schalter. */
      try {
        window.localStorage.setItem('dp_karten_schalter', extra.kartenvariante ? '1' : '0');
      } catch (e) {}
    }
    /* Die drei Achsen aus `dp_user_settings`. */
    if (extra.theme   !== undefined) setzeJsonFeld('ui_theme',   extra.theme);
    if (extra.cards   !== undefined) setzeJsonFeld('ui_cards',   extra.cards);
    if (extra.surface !== undefined) setzeJsonFeld('ui_surface', extra.surface);
  }

  /* Was gerade eingestellt ist - fuer die Beschriftung und das Protokoll.
     Ein Lauf, der seine Variante nicht nennt, ist nicht nachvollziehbar. */
  function varianteKurz(layout, extra){
    var t = [ (layout === '' || layout == null) ? 'Heute' : layout ];
    if (extra) {
      if (extra.kartenstil) t.push('ks:' + extra.kartenstil);
      if (extra.objkarte)   t.push('ok:' + extra.objkarte);
      if (extra.theme)      t.push('th:' + extra.theme);
      if (extra.kartenvariante) t.push('kv:' + extra.kartenvariante);
      if (extra.cards)      t.push('cd:' + extra.cards);
      if (extra.surface)    t.push('sf:' + extra.surface);
    }
    return t.join(' · ');
  }

  function lade(breite, layout, hoehe, extra){
    setzeMerker(layout, extra);
    rahmen.style.width  = (breite + 2) + 'px';          /* +2 für den Rahmen */
    rahmen.style.height = ((extra && extra.echteHoehe) ? (hoehe || 780) : Math.min(hoehe || 780, 760)) + 'px';
    var kurz = varianteKurz(layout, extra);
    lbl.textContent = breite + ' px · ' + kurz;
    aktuell = [ kurz + ' @ ' + breite, breite, hoehe || 780 ];
    return new Promise(function(fertig){
      var los = false;
      function da(){ if (los) return; los = true; warte(3600).then(fertig); }
      f.addEventListener('load', da, { once: true });
      setTimeout(da, 22000);   /* Notbremse - darf gedrosselt sein */
      f.src = (extra && extra.ziel ? extra.ziel : ZIEL) + (((extra && extra.ziel) || ZIEL).indexOf('?') >= 0 ? '&' : '?') + 'mk=' + Date.now();
      sperreFrueh();
    });
  }

  /* ══ v2570 · DIE SPERRE: MESSEN DARF NICHTS SCHREIBEN ════════════════
     Marcel 21.10.2026: „keine produktiven Daten veraendern", keine
     kostenpflichtigen Abrufe. Drei Ansichten (Cockpit, Portfolio-Strategie,
     Marktbericht) rufen beim OEFFNEN saveObj, das Einstellungsfenster
     speichert automatisch, und saveObj ist dreimal umhuellt (free-lock,
     ankauf-ansicht ...) - eine Stummschaltung der Funktion waere nach dem
     naechsten Wrapper wieder offen. Gesperrt wird deshalb am NETZ:
     fetch, XMLHttpRequest und sendBeacon im Pruefling.

       - jede Methode ausser GET/HEAD/OPTIONS        -> gesperrt (200, {})
       - GET auf kostenpflichtige Pfade (KI, Bericht,
         AVM, Marktpreise, ImmoMetrica)              -> gesperrt (503)
       - confirm/alert/prompt                        -> gestubbt (confirm=false)

     Gesetzt wird FRUEH (sobald das neue Dokument existiert, ueber eine
     MessageChannel-Schleife, die im Hintergrund nicht gedrosselt wird) und
     nach dem Laden noch einmal. Jeder gesperrte Aufruf landet in
     `win.__DPM_GESPERRT` - die Deckung der Sperre ist damit nachweisbar,
     und `DPM.sperreProbe()` beweist einmal, dass sie greift. */
  var SPERRE_AN = true;
  /* Reine Stand-Abfragen in diesen Familien kosten nichts und tragen die Oberflaeche (Kontingent-Pille, Anbieter-Status). */
  var LESEN_FREI = /\/(credits|health|status|credentials|dokument-arten|arten|searches|history)(\/|$|\?)/i;
  var KOSTEN_GET = /\/ai\/|\/marktbericht\/(reports|from-dealpilot|run|abruf)|\/avm|market-analysis|marktpreis|\/immometrica|\/checkout|\/credits\/(checkout|consume)/i;
  function sperreSetzen(win){
    if (!SPERRE_AN || !win) return false;
    try {
      if (win.__dpmSperre) return true;
      if (!win.location || win.location.href === 'about:blank') return false;
      win.__dpmSperre = true;
      var log = win.__DPM_GESPERRT = win.__DPM_GESPERRT || [];
      var urlVon = function(x){ try { return typeof x === 'string' ? x : (x && x.url) || String(x); } catch (e) { return '?'; } };
      var gesperrt = function(meth, url){
        meth = String(meth || 'GET').toUpperCase();
        if (meth !== 'GET' && meth !== 'HEAD' && meth !== 'OPTIONS') return 'schreibt';
        if (KOSTEN_GET.test(url) && !LESEN_FREI.test(url)) return 'kostet';
        return null;
      };
      var echtFetch = win.fetch;
      win.fetch = function(inp, init){
        var url = urlVon(inp), meth = (init && init.method) || (inp && inp.method) || 'GET';
        var g = gesperrt(meth, url);
        if (g) {
          log.push({ art: g, m: String(meth).toUpperCase(), u: String(url).replace(/[?#].*$/, '').slice(-60) });
          return Promise.resolve(new win.Response(g === 'kostet' ? '{"error":"dpm-gesperrt"}' : '{}',
            { status: g === 'kostet' ? 503 : 200, headers: { 'Content-Type': 'application/json' } }));
        }
        return echtFetch.apply(this, arguments);
      };
      var XO = win.XMLHttpRequest && win.XMLHttpRequest.prototype;
