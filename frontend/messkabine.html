  messkabine.html · v1901

  Die Fenstergröße des Browsers wirkt in dieser Umgebung NICHT auf den
  Viewport der Seite — gemessen am 24.09.2026: resize_window auf 390 px
  meldet Erfolg, innerWidth bleibt bei 1920. Responsives Verhalten lässt
  sich so nicht prüfen.

  Was funktioniert, ist ein iframe mit fester Breite. Weil er dieselbe
  Herkunft hat wie die App, kann von außen hineingemessen werden.

  Der Träger muss eine Seite OHNE laufende App sein: sonst läuft die
  Anwendung zweimal, teilt sich localStorage und Service Worker, und man
  misst am Ende die Störung statt die Seite.

  ── v1901 · ZWEI ÄNDERUNGEN ─────────────────────────────────────────────

  (1) DER ZÄHLER HAT PHANTOME GEMELDET.

  Bis v1591 zählte die Klickflächen-Schleife jedes Element, dessen
  `getBoundingClientRect()` eine Fläche von mehr als null ergab. Das ist
  nicht dasselbe wie „wird gemalt": die Haken `#ai-pdf-sec-*` im Reiter
  Pilot-Analyse liegen in einem zugeklappten `<details>`. Chrome überspringt
  dessen Inhalt — **der Kasten bleibt mit 16×16 px stehen, gemalt und
  treffbar ist nichts.** Sie wurden deshalb als „unter 40 px" gemeldet, und
  wer dem Befund folgte, suchte tote Knöpfe, die es nicht gibt.

  **Über `getComputedStyle` ist das nicht zu sehen** — gemessen stehen alle
  zwölf auf `content-visibility: visible`, `visibility: visible`,
  `opacity: 1`, `display: block`. `checkVisibility()` ist das einzige
  Werkzeug, das sie kennt, und es gibt für alle zwölf `false` zurück.
  Jede Schleife hier filtert jetzt darüber — ohne Zusatzoptionen, die
  Begründung steht unten an `gemalt()`.

  **Der Zähler nennt dabei seine Deckung** (`… übersprungen`), statt still
  weniger zu melden. Ein Prüfer, der grün wird, ohne zu sagen wie viel er
  gelesen hat, ist der teure Fehler — derselbe Befund wie beim gold-audit,
  der 6 statt 181 Dateien las und „sauber" meldete.

  (2) EIN HARNESS, DAMIT EINE PRÜFSTRECKE NICHT AM TAB HÄNGT.

  Eine Abnahme über vier Aussehen, neun Reiter und drei Breiten sind rund
  110 Messungen. Ein Renderer-Aufruf je Klick läuft in die Zeitgrenze, und
  ein Harness, der nur im `window` lebt, ist beim nächsten geschlossenen Tab
  weg. Er steht deshalb HIER, in der Datei.

      await DPM.lauf({ breite: 390, layout: 'v1b' })   // ein Aufruf, neun Reiter
      await DPM.lauf({ breite: 390, layout: '' })      // '' = Ansicht "Heute"
      DPM.messe(DPM.ziel().d, DPM.ziel().win, 'Portfolio')

  `layout` ist der Merker `dp_layout`: '' Heute · v1b Aktenmappe ·
  v2 Kanzlei · v2b Tower. Gesetzt wird er VOR dem Laden, und der iframe
  lädt danach ganz neu — nie im laufenden Dokument umschalten, sonst
  hinterlässt der Skin-Wechsel Inline-Variablen und man misst die Störung.
-->

<script>
(function(){
  'use strict';
  var GERAETE = [
    ['iPhone SE',        360,  780],
    ['iPhone SE 2',      375,  667],
    ['iPhone 14',        390,  844],
    ['iPhone 14 Pro Max',430,  932],

  ];
  var ZIEL = new URLSearchParams(location.search).get('ziel') || '/';
  var f = document.getElementById('f'), rahmen = document.getElementById('rahmen');
  var lbl = document.getElementById('lbl'), w = document.getElementById('w');
  var aktuell = null;

  /* ── Was wird GEMALT? ───────────────────────────────────────────────────
     Der Kasten aus getBoundingClientRect() beweist das nicht: in einem
     zugeklappten <details> bleibt er stehen, obwohl Chrome den Inhalt
     überspringt. Siehe Kopf dieser Datei.

     OHNE Zusatzoptionen. Gemessen am 06.10.2026, warum:

       checkVisibility()                     -> 230 von 230 (Schublade offen)
       checkVisibility({checkOpacity:true})  ->  11 von 230

     Die 219 fielen alle über `opacity`. Nachgesehen im Bild: der Reiter
     Pilot-Analyse ist auf dem Schirm vollständig gemalt — Überschrift,
     Knopf „Pilot-Analyse starten", Schalter, Co-Pilot-Block. Trotzdem
     meldet `getComputedStyle(#s5).opacity` dort dauerhaft `0`, auch nach
     3,4 Sekunden. Das ist die bekannte Falle: **im iframe meldet
     getComputedStyle teils veraltete Werte** — eine Transition, die im
     nicht beachteten Dokument auf ihrem Startwert einfriert.

     > `checkOpacity` und `checkVisibilityCSS` lesen genau den Kanal, der
     > hier lügt. `checkVisibility()` ohne Optionen stützt sich dagegen
     > darauf, ob der Browser das Element überhaupt rendert — und das
     > stimmte an der Stichprobe.

     Die zwölf Haken `#ai-pdf-sec-*` im zugeklappten `<details>` gibt schon
     die Grundform mit `false` zurück (gemessen: alle zwölf, bei
     `getComputedStyle` ständen sie auf `content-visibility: visible`,
     `visibility: visible`, `opacity: 1`, `display: block` und 16×16 px).
     **Die Eigenschaft ist über getComputedStyle gar nicht lesbar** —
     `checkVisibility()` ist das einzige Werkzeug, das sie kennt.

     `contentVisibilityAuto` ändert an der Zahl nichts (gemessen: 0 von
     230) und steht deshalb auch nicht hier.

     ── v1901e · UND WARUM DAS ALLEIN NICHT REICHT ──────────────────────

     **Im verborgenen Tab meldet `checkVisibility()` fast alles als
     ungemalt.** Gemessen am 06.10.2026, dasselbe Dokument, dieselbe Stelle:

         Fenster im Vordergrund   1.093 von 7.814 gemalt
         Fenster im Hintergrund       0 von 7.883 gemalt  (später 418)

     Ein Prüfer, der so filtert, findet im Hintergrund **nichts** und meldet
     deshalb auch keinen Fehler. Das ist der teuerste Zustand überhaupt: er
     wird grün, weil er blind ist.

     `gemalt()` prüft deshalb zuerst das, was von der Sichtbarkeit des
     Fensters UNABHÄNGIG ist — Geometrie und ein zugeklapptes `<details>` —
     und zieht `checkVisibility()` nur hinzu, wenn das Dokument wirklich
     angezeigt wird. `DPM.lage()` sagt, welcher Weg gerade gilt, und die
     Anzeige schreibt es dazu. */
  function gemalt(el){
    var r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return false;
    /* Zugeklapptes <details>: der Inhalt wird übersprungen, der Kasten
       bleibt. Das ist auch im Hintergrund eindeutig ablesbar. */
    var det = el.closest ? el.closest('details') : null;
    while (det) {
      if (!det.open) {
        var sum = det.querySelector(':scope > summary');
        if (!(sum && sum.contains(el))) return false;
      }
      det = det.parentElement && det.parentElement.closest ? det.parentElement.closest('details') : null;
    }
    if (el.hasAttribute && el.hasAttribute('hidden')) return false;
    var d = el.ownerDocument;
    if (d && d.hidden) return true;        /* im Hintergrund nur Geometrie */
    if (typeof el.checkVisibility !== 'function') return null;
    try { return el.checkVisibility(); } catch (e) { return null; }
  }

  /* Wie zuverlässig ist diese Messung gerade? */
  function lage(){
    var z = ziel();
    return {
      fensterSichtbar: !document.hidden,
      zielSichtbar: z.d ? !z.d.hidden : null,
      weg: (z.d && z.d.hidden) ? 'nur Geometrie (Fenster im Hintergrund)'
                               : 'Geometrie + checkVisibility()',
      hinweis: (z.d && z.d.hidden)
        ? 'Zeitgeber sind gedrosselt und checkVisibility() meldet im Hintergrund '
          + 'fast alles als ungemalt. Gewartet wird deshalb über MessageChannel, '
          + 'und gefiltert wird nur über Geometrie und <details>. Farbwerte aus '
          + 'getComputedStyle sind hier NICHT verlässlich (eingefrorene Übergänge).'
        : 'voll messbar'
    };
  }

  /* Warten, das die Hintergrund-Drosselung nicht trifft.
     `setTimeout(…, 200)` dauerte im verborgenen Tab gemessen 12.071 ms —
     neun Reiter liefen damit in jede Zeitgrenze. Eine Nachricht über einen
     MessageChannel ist dagegen eine gewöhnliche Aufgabe und wird nicht
     geklemmt; der Ereignislauf bleibt frei, die App kann dazwischen
     rendern. */
  function warte(ms){
    return new Promise(function(fertig){
      var bis = Date.now() + ms;
      var k = new MessageChannel();
      k.port1.onmessage = function(){
        if (Date.now() >= bis) { k.port1.close(); fertig(); }
        else k.port2.postMessage(0);
      };
      k.port2.postMessage(0);
    });
  }

  /* ── Farbe: Text und sein EFFEKTIVER Grund als Paar ────────────────────
     Einzeln ist jede Farbe immer richtig. Gemessen wird der erste Vorfahr
     mit Fläche, und Alpha wird ausgerechnet, nicht geschätzt. */
  /* v1901b · DIE FARBE WIRD GEMALT, NICHT GELESEN.

     Bis v1901a stand hier ein Parser über `String(c).match(/[\d.]+/g)`. Er
     hat 308 angebliche Kontrastfehler im Reiter Bewertung erzeugt, und
     keiner davon war einer. Chrome gibt computed colors heute in CSS Color 4
     zurück:

         color(srgb 0.788235 0.658824 0.298039 / 0.8)

     Das ist Gold #C9A84C bei 80 %. Der Parser las `0.79, 0.66, 0.30` als
     0–255 und machte daraus rgb(1,1,0) — Schwarz. Gegen den Grund
     rgb(42,39,39) ergab das 1,35, und die Tabelle sah im Bericht aus wie
     unlesbar, während sie in Wahrheit goldene Kopfzeilen hat.

     > **Eine Zahlenliste in Klammern sagt nicht, in welcher Einheit sie
     > steht.** Dieselbe Falle wie `marktmieteCold`.

     Statt die Syntaxen nachzubauen (rgb, rgba, color(srgb), oklch, lab …)
     wird die Farbe jetzt auf einen 1×1-Canvas GEMALT und das Pixel gelesen.
     Der Browser normalisiert dabei alles, was er selbst akzeptiert, und die
     Komposition über dem Grund fällt im selben Schritt mit an — kein
     eigenes Alpha-Rechnen mehr. */
  var cvs = document.createElement('canvas');
  cvs.width = cvs.height = 1;
  var ctx = cvs.getContext('2d', { willReadFrequently: true });

  /* v1901d · GEMERKT, SONST LÄUFT DIE PRÜFSTRECKE IN DIE ZEITGRENZE.
     Ein Lauf über neun Reiter malte rund 40.000 Mal auf den Canvas und
     brach nach 45 Sekunden ab. Verschiedene Farben gibt es dabei keine
     hundert — dieselbe Angabe über demselben Grund ergibt immer dasselbe
     Pixel, also wird das Ergebnis gemerkt. */
  var merk = Object.create(null);

  /* Malt `farbe` über `hinter` (ein {r,g,b}) und gibt das Ergebnis zurück.
     Nimmt der Canvas die Angabe nicht an, behält fillStyle den alten Wert —
     daran ist ein Fehlschlag erkennbar, und dann wird null gemeldet statt
     geraten. */
  function male(farbe, hinter){
    var schl = farbe + '|' + hinter.r + ',' + hinter.g + ',' + hinter.b;
    if (schl in merk) return merk[schl];
    return (merk[schl] = male_roh(farbe, hinter));
  }
  function male_roh(farbe, hinter){
    ctx.clearRect(0, 0, 1, 1);
    ctx.fillStyle = 'rgb(' + hinter.r + ',' + hinter.g + ',' + hinter.b + ')';
    ctx.fillRect(0, 0, 1, 1);
    ctx.fillStyle = '#000000';
    ctx.fillStyle = farbe;
    if (ctx.fillStyle === '#000000' && !/^(#000000|black|rgb\(0,\s*0,\s*0\))/i.test(String(farbe).trim())) return null;
    ctx.fillRect(0, 0, 1, 1);
    var p = ctx.getImageData(0, 0, 1, 1).data;
    return { r: p[0], g: p[1], b: p[2], a: 1 };
  }
  /* Ist die Farbe überhaupt sichtbar, also nicht vollständig durchsichtig?
     Über zwei verschiedenen Gründen gemalt: kommt zweimal der Grund heraus,
     ist sie durchsichtig. */
  function deckt(farbe){
    var a = male(farbe, { r:0, g:0, b:0 }), b = male(farbe, { r:255, g:255, b:255 });
    if (!a || !b) return false;
    return !(a.r === 0 && a.g === 0 && a.b === 0 && b.r === 255 && b.g === 255 && b.b === 255);
  }
  /* ══ v1986 · EIN VERLAUF IST AUCH EIN GRUND ═══════════════════════════

     Hier stand nur `backgroundColor`. Gemessen am Abruf-Knopf der
     Datenaufnahme: er traegt `background-color: rgba(0,0,0,0)` und
     `background-image: linear-gradient(#D5BB73, #C9A84C)`. Die alte
     Fassung fiel also auf die Schicht DAHINTER durch (#0c0c0e) und
     meldete Kontrast 1,07 fuer einen Knopf, der bei rund 8:1 liegt.

     In dieser Marke ist das der Normalfall, nicht die Ausnahme: der
     Runway ist die Hausfarbe jeder Handlungsflaeche.

     Ein Verlauf wird ueber seine Farbstopps GEMITTELT. Jeder Stopp
     wird mit `male()` ueber den bereits gesammelten Grund gemalt,
     damit Alpha in den Stopps richtig faellt. Das ist eine Naeherung —
     und sie ist als solche benannt: `quelle` sagt, woher der Grund
     kommt.

     > Ein `url(...)` kann niemand ausrechnen. Dann meldet die Funktion
     > `unmessbar` statt einer Zahl, die nach Messung aussieht. Eine
     > fehlende Messung ist ehrlich, eine falsche ist teuer. */
  function stopps(bild){
    /* Farbstopps aus einem CSS-Verlauf. Keine Prozente, keine Winkel —
       nur die Farben. `color(srgb …)` ist dabei, weil `male()` sie kann
       und der Selbsttest der Kabine genau daran einmal gescheitert ist. */
    var re = /(rgba?\([^)]*\)|color\(\s*srgb[^)]*\)|#[0-9a-fA-F]{3,8}\b|\b(?:transparent|currentcolor)\b)/gi;
    var out = [], m;
    while ((m = re.exec(bild))) out.push(m[1]);
    return out;
  }
  /* v1988 · Die Ebenen eines `background-image` trennen. Kommas auf
     Klammertiefe 0 sind Ebenengrenzen, alle anderen gehoeren zu einer
     Farbe oder einer Positionsangabe. */
  function ebenenTrennen(bild){
    var out = [], tief = 0, start = 0;
    for (var i = 0; i < bild.length; i++) {
      var c = bild[i];
      if (c === '(') tief++;
      else if (c === ')') tief--;
      else if (c === ',' && tief === 0) { out.push(bild.slice(start, i)); start = i + 1; }
    }
    out.push(bild.slice(start));
    return out.map(function (x) { return x.trim(); }).filter(Boolean);
  }
  function effGrund(el, win){
    /* Erster Vorfahr mit Fläche; durchsichtige Schichten werden von hinten
       nach vorn übereinandergemalt. Weiß ist der Anfang — das Blatt. */
    var p = el, stapel = [], unmessbar = null, hatVerlauf = false;
    while (p) {
      var st = win.getComputedStyle(p);
      var bild = st.backgroundImage;
      if (bild && bild !== 'none') {
        if (/url\(/i.test(bild)) {
          /* Ein Bild als Grund - die Farbe daraus zu raten waere eine
             Behauptung. Der Befund ist: nicht messbar, und warum. */
          unmessbar = unmessbar || { grund: 'url() im background-image', bei: p };
        } else {
          /* ══ v1988 · EBENENWEISE, NICHT ALLE STOPPS IN EINEN TOPF ═══

             v1986 hat hier ALLE Farbstopps ALLER Ebenen gemittelt.
             Gemessen an `.dp-pfbar`: drei Ebenen, zehn Stopps —
             zwei Schraffuren mit Alpha 0,03 (acht Stopps) und unten
             eine radiale CREME-Flaeche (zwei Stopps). Der Mittelwert
             ergab #3d3c3b statt der Wahrheit bei rund #FBF6E9, und
             auf dieser falschen Zahl habe ich in v1987 eine Textfarbe
             geaendert.

             > CSS malt die Ebenen von der LETZTEN zur ersten: die
             > letzte liegt unten, die erste oben. Eine deckende Ebene
             > macht alles unter ihr bedeutungslos — und alles
             > darueber liegt auf IHR.

             Also je Ebene ein eigener Eintrag, in der Reihenfolge, in
             der CSS sie malt. Deckt eine Ebene, endet die Suche dort.

             Getrennt wird mit TIEFENVERFOLGUNG, nicht mit einem Regex:
             mein erster Anlauf nahm /,(?![^()]*\))/ und zerlegte den
             echten Wert in 13 Teile statt 3 - das Muster traegt nur
             EINE Klammerebene, und `repeating-linear-gradient(0deg,
             rgba(…))` hat zwei. Dieselbe Lehre wie bei der
             CSS-Klammerbilanz: Paare zaehlen findet das nie, nur die
             TIEFE verfolgen. */
          var ebenen = ebenenTrennen(bild);
          var tiefsteDeckend = -1;
          for (var e = ebenen.length - 1; e >= 0; e--) {
            var ss = stopps(ebenen[e]);
            if (!ss.length) continue;
            if (ss.every(function (x) { return ist_deckend(x); })) { tiefsteDeckend = e; break; }
          }
          /* Von der untersten relevanten Ebene nach oben einreihen.
             `stapel` wird spaeter von HINTEN nach vorn gemalt, also
             kommt die unterste Ebene ZULETZT hinein. */
          var vonUnten = (tiefsteDeckend >= 0) ? tiefsteDeckend : ebenen.length - 1;
          for (var e2 = 0; e2 <= vonUnten; e2++) {
            var s2 = stopps(ebenen[e2]);
            if (s2.length) { hatVerlauf = true; stapel.push({ verlauf: s2 }); }
          }
          if (tiefsteDeckend >= 0) break;
        }
      }
      var c = st.backgroundColor;
      if (deckt(c)) { stapel.push(c); if (ist_deckend(c)) break; }
      p = p.parentElement;
    }
    var out = { r:255, g:255, b:255, a:1 };
    for (var i = stapel.length - 1; i >= 0; i--) {
      var lage = stapel[i];
      if (lage && lage.verlauf) {
        var summe = { r:0, g:0, b:0 }, n = 0;
        for (var j = 0; j < lage.verlauf.length; j++) {
          var q = male(lage.verlauf[j], out);
          if (q) { summe.r += q.r; summe.g += q.g; summe.b += q.b; n++; }
        }
        if (n) out = { r: summe.r/n, g: summe.g/n, b: summe.b/n, a: 1 };
      } else {
        var k = male(lage, out);
        if (k) out = k;
      }
    }
    out.quelle = unmessbar ? 'unmessbar' : (hatVerlauf ? 'verlauf' : 'farbe');
    if (unmessbar) out.warum = unmessbar.grund;
    return out;
  }
  /* Deckend heißt: über Schwarz und über Weiß kommt dasselbe heraus. */
  function ist_deckend(farbe){
    var a = male(farbe, { r:0, g:0, b:0 }), b = male(farbe, { r:255, g:255, b:255 });
    if (!a || !b) return false;
    return Math.abs(a.r-b.r) < 2 && Math.abs(a.g-b.g) < 2 && Math.abs(a.b-b.b) < 2;
  }
  function lum(c){
    function k(v){ v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
    return 0.2126*k(c.r) + 0.7152*k(c.g) + 0.0722*k(c.b);
  }
  function kontrast(a, b){
    var l1 = lum(a), l2 = lum(b);
    return Math.round(((Math.max(l1,l2)+0.05) / (Math.min(l1,l2)+0.05)) * 100) / 100;
  }
  function rgbTxt(c){ return 'rgb(' + Math.round(c.r) + ',' + Math.round(c.g) + ',' + Math.round(c.b) + ')'; }
  function nam(el){
    var k = (typeof el.className === 'string' ? el.className : '').trim();
    return el.tagName.toLowerCase() + (el.id ? '#' + el.id : '')
         + (k ? '.' + k.split(/\s+/).slice(0, 2).join('.') : '');
  }

  /* ── Der Messkern. Gibt ein Objekt zurück, nicht Text — damit ein
        gebündelter Lauf sammeln kann, statt je Fläche einen Aufruf zu
        kosten. ─────────────────────────────────────────────────────────── */
  function messe(d, win, label){

  function apNam(el){

          && p.scrollWidth > p.clientWidth) return apNam(p);
      if (cs.overflow === 'hidden') return apNam(p);
      p = p.parentElement;

    return null;

  function apUeberlauf(d, win){

    [].slice.call(d.querySelectorAll('body *')).forEach(function(el){
      var r = el.getBoundingClientRect();

      if (r.left >= win.innerWidth) return;

    if (!opfer) return { urteil: 'kein Testknopf GANZ im Bild gefunden ('
                                 + suchschritte + ' Abschnitte durchsucht)' };
    var vorher = apBedienbar(d, win).verdaechtig.length;
    var r = opfer.getBoundingClientRect();
    var decke = d.createElement('div');
    decke.id = '_dpm-selbsttest';
    decke.style.cssText = 'position:fixed;left:'+(r.left-4)+'px;top:'+(r.top-4)
      + 'px;width:'+(r.width+8)+'px;height:'+(r.height+8)
      + 'px;background:rgba(255,0,0,.35);z-index:99999';
    d.body.appendChild(decke);
    await warte(300);
    var mit = apBedienbar(d, win);
    var gefunden = mit.verdaechtig.some(function(x){ return x.el === opfer; });
    decke.remove();
    await warte(250);
    var danach = apBedienbar(d, win).verdaechtig.length;
    return {
      testknopf: ((opfer.textContent||'').trim().slice(0,24) || '(ohne Text)')
                 + ' ' + Math.round(r.width)+'x'+Math.round(r.height)
                 + ' (gefunden im ' + suchschritte + '. Abschnitt)',
      ohneDecke: vorher, mitDecke: mit.verdaechtig.length,
      knopfGefunden: gefunden, nachEntfernen: danach,
      urteil: (vorher === 0 && gefunden && danach === 0)
        ? 'BESTANDEN - findet einen echten Fehler und schweigt danach wieder'
        : 'DURCHGEFALLEN - gruene Messungen sind nichts wert'
    };
  }

  window.DPM = {
                 pruefeAnsicht: pruefeAnsicht, pruefSelbsttest: pruefSelbsttest,
                 apBedienbar: apBedienbar, apUeberlauf: apUeberlauf,
                 apQuerScroller: apQuerScroller, apScroller: apScroller, messe: messe, zeige: zeige, lade: lade, lauf: lauf,
                 reiterLauf: reiterLauf, ziel: ziel, effGrund: effGrund,
                 kontrast: kontrast, gemalt: gemalt, male: male,
                 lage: lage, warte: warte,
                 standbild: standbild, standbildProbe: standbildProbe,
                 rafErsatz: rafErsatz, rafProbe: rafProbe,
                 stopps: stopps,
                 standbildAn: function(){ return SB_AN; },
                 selbsttest: selbsttest, geraete: GERAETE };

  waehle(2);   /* iPhone 14 */
})();
