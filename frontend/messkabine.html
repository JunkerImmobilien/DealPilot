  Die Fenstergröße des Browsers wirkt in dieser Umgebung NICHT auf den
  Viewport der Seite — gemessen am 24.09.2026: resize_window auf 390 px
  meldet Erfolg, innerWidth bleibt bei 1920. Responsives Verhalten lässt
  sich so nicht prüfen.

  Was funktioniert, ist ein iframe mit fester Breite. Weil er dieselbe
  Herkunft hat wie die App, kann von außen hineingemessen werden.

  Der Träger muss eine Seite OHNE laufende App sein: sonst läuft die
  Anwendung zweimal, teilt sich localStorage und Service Worker, und man
  misst am Ende die Störung statt die Seite.

  ── v1901 · ZWEI ÄNDERUNGEN ─────────────────────────────────────────────

  (1) DER ZÄHLER HAT PHANTOME GEMELDET.

  Bis v1591 zählte die Klickflächen-Schleife jedes Element, dessen
  `getBoundingClientRect()` eine Fläche von mehr als null ergab. Das ist
  nicht dasselbe wie „wird gemalt": die Haken `#ai-pdf-sec-*` im Reiter
  Pilot-Analyse liegen in einem zugeklappten `<details>`. Chrome überspringt
  dessen Inhalt — **der Kasten bleibt mit 16×16 px stehen, gemalt und
  treffbar ist nichts.** Sie wurden deshalb als „unter 40 px" gemeldet, und
  wer dem Befund folgte, suchte tote Knöpfe, die es nicht gibt.

  **Über `getComputedStyle` ist das nicht zu sehen** — gemessen stehen alle
  zwölf auf `content-visibility: visible`, `visibility: visible`,
  `opacity: 1`, `display: block`. `checkVisibility()` ist das einzige
  Werkzeug, das sie kennt, und es gibt für alle zwölf `false` zurück.
  Jede Schleife hier filtert jetzt darüber — ohne Zusatzoptionen, die
  Begründung steht unten an `gemalt()`.

  **Der Zähler nennt dabei seine Deckung** (`… übersprungen`), statt still
  weniger zu melden. Ein Prüfer, der grün wird, ohne zu sagen wie viel er
  gelesen hat, ist der teure Fehler — derselbe Befund wie beim gold-audit,
  der 6 statt 181 Dateien las und „sauber" meldete.

  (2) EIN HARNESS, DAMIT EINE PRÜFSTRECKE NICHT AM TAB HÄNGT.

  Eine Abnahme über vier Aussehen, neun Reiter und drei Breiten sind rund
  110 Messungen. Ein Renderer-Aufruf je Klick läuft in die Zeitgrenze, und
  ein Harness, der nur im `window` lebt, ist beim nächsten geschlossenen Tab
  weg. Er steht deshalb HIER, in der Datei.

      await DPM.lauf({ breite: 390, layout: 'v1b' })   // ein Aufruf, neun Reiter
      await DPM.lauf({ breite: 390, layout: '' })      // '' = Ansicht "Heute"
      DPM.messe(DPM.ziel().d, DPM.ziel().win, 'Portfolio')

  `layout` ist der Merker `dp_layout`: '' Heute · v1b Aktenmappe ·
  v2 Kanzlei · v2b Tower. Gesetzt wird er VOR dem Laden, und der iframe
  lädt danach ganz neu — nie im laufenden Dokument umschalten, sonst
  hinterlässt der Skin-Wechsel Inline-Variablen und man misst die Störung.
-->

         Fenster im Vordergrund   1.093 von 7.814 gemalt
         Fenster im Hintergrund       0 von 7.883 gemalt  (später 418)

  function gemalt(el){
    var r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return false;
    /* Zugeklapptes <details>: der Inhalt wird übersprungen, der Kasten
       bleibt. Das ist auch im Hintergrund eindeutig ablesbar. */
    var det = el.closest ? el.closest('details') : null;
    while (det) {
      if (!det.open) {
        var sum = det.querySelector(':scope > summary');
        if (!(sum && sum.contains(el))) return false;
      }
      det = det.parentElement && det.parentElement.closest ? det.parentElement.closest('details') : null;
    }
    if (el.hasAttribute && el.hasAttribute('hidden')) return false;
    var d = el.ownerDocument;
    if (d && d.hidden) return true;        /* im Hintergrund nur Geometrie */

    try { return el.checkVisibility(); } catch (e) { return null; }
  }

  /* Wie zuverlässig ist diese Messung gerade? */
  function lage(){
    var z = ziel();
    return {
      fensterSichtbar: !document.hidden,
      zielSichtbar: z.d ? !z.d.hidden : null,
      weg: (z.d && z.d.hidden) ? 'nur Geometrie (Fenster im Hintergrund)'

      hinweis: (z.d && z.d.hidden)
        ? 'Zeitgeber sind gedrosselt und checkVisibility() meldet im Hintergrund '
          + 'fast alles als ungemalt. Gewartet wird deshalb über MessageChannel, '
          + 'und gefiltert wird nur über Geometrie und <details>. Farbwerte aus '
          + 'getComputedStyle sind hier NICHT verlässlich (eingefrorene Übergänge).'
        : 'voll messbar'
    };
  }

  /* Warten, das die Hintergrund-Drosselung nicht trifft.
     `setTimeout(…, 200)` dauerte im verborgenen Tab gemessen 12.071 ms —
     neun Reiter liefen damit in jede Zeitgrenze. Eine Nachricht über einen
     MessageChannel ist dagegen eine gewöhnliche Aufgabe und wird nicht
     geklemmt; der Ereignislauf bleibt frei, die App kann dazwischen
     rendern. */
  function warte(ms){
    return new Promise(function(fertig){
      var bis = Date.now() + ms;
      var k = new MessageChannel();
      k.port1.onmessage = function(){
        if (Date.now() >= bis) { k.port1.close(); fertig(); }
        else k.port2.postMessage(0);
      };
      k.port2.postMessage(0);
    });
  }

  /* ── Farbe: Text und sein EFFEKTIVER Grund als Paar ────────────────────
     Einzeln ist jede Farbe immer richtig. Gemessen wird der erste Vorfahr
     mit Fläche, und Alpha wird ausgerechnet, nicht geschätzt. */
  /* v1901b · DIE FARBE WIRD GEMALT, NICHT GELESEN.

     Bis v1901a stand hier ein Parser über `String(c).match(/[\d.]+/g)`. Er
     hat 308 angebliche Kontrastfehler im Reiter Bewertung erzeugt, und
     keiner davon war einer. Chrome gibt computed colors heute in CSS Color 4
     zurück:

         color(srgb 0.788235 0.658824 0.298039 / 0.8)

     Das ist Gold #C9A84C bei 80 %. Der Parser las `0.79, 0.66, 0.30` als
     0–255 und machte daraus rgb(1,1,0) — Schwarz. Gegen den Grund
     rgb(42,39,39) ergab das 1,35, und die Tabelle sah im Bericht aus wie
     unlesbar, während sie in Wahrheit goldene Kopfzeilen hat.

     > **Eine Zahlenliste in Klammern sagt nicht, in welcher Einheit sie
     > steht.** Dieselbe Falle wie `marktmieteCold`.

     Statt die Syntaxen nachzubauen (rgb, rgba, color(srgb), oklch, lab …)
     wird die Farbe jetzt auf einen 1×1-Canvas GEMALT und das Pixel gelesen.
     Der Browser normalisiert dabei alles, was er selbst akzeptiert, und die
     Komposition über dem Grund fällt im selben Schritt mit an — kein
     eigenes Alpha-Rechnen mehr. */
  var cvs = document.createElement('canvas');
  cvs.width = cvs.height = 1;
  var ctx = cvs.getContext('2d', { willReadFrequently: true });

  /* v1901d · GEMERKT, SONST LÄUFT DIE PRÜFSTRECKE IN DIE ZEITGRENZE.
     Ein Lauf über neun Reiter malte rund 40.000 Mal auf den Canvas und
     brach nach 45 Sekunden ab. Verschiedene Farben gibt es dabei keine
     hundert — dieselbe Angabe über demselben Grund ergibt immer dasselbe
     Pixel, also wird das Ergebnis gemerkt. */
  var merk = Object.create(null);

  /* Malt `farbe` über `hinter` (ein {r,g,b}) und gibt das Ergebnis zurück.
     Nimmt der Canvas die Angabe nicht an, behält fillStyle den alten Wert —
     daran ist ein Fehlschlag erkennbar, und dann wird null gemeldet statt
     geraten. */
  function male(farbe, hinter){
    var schl = farbe + '|' + hinter.r + ',' + hinter.g + ',' + hinter.b;
    if (schl in merk) return merk[schl];
    return (merk[schl] = male_roh(farbe, hinter));
  }
  function male_roh(farbe, hinter){
    ctx.clearRect(0, 0, 1, 1);
    ctx.fillStyle = 'rgb(' + hinter.r + ',' + hinter.g + ',' + hinter.b + ')';
    ctx.fillRect(0, 0, 1, 1);
    ctx.fillStyle = '#000000';
    ctx.fillStyle = farbe;
    if (ctx.fillStyle === '#000000' && !/^(#000000|black|rgb\(0,\s*0,\s*0\))/i.test(String(farbe).trim())) return null;
    ctx.fillRect(0, 0, 1, 1);
    var p = ctx.getImageData(0, 0, 1, 1).data;
    return { r: p[0], g: p[1], b: p[2], a: 1 };
  }
  /* Ist die Farbe überhaupt sichtbar, also nicht vollständig durchsichtig?
     Über zwei verschiedenen Gründen gemalt: kommt zweimal der Grund heraus,
     ist sie durchsichtig. */
  function deckt(farbe){
    var a = male(farbe, { r:0, g:0, b:0 }), b = male(farbe, { r:255, g:255, b:255 });
    if (!a || !b) return false;
    return !(a.r === 0 && a.g === 0 && a.b === 0 && b.r === 255 && b.g === 255 && b.b === 255);
  }
  function effGrund(el, win){
    /* Erster Vorfahr mit Fläche; durchsichtige Schichten werden von hinten
       nach vorn übereinandergemalt. Weiß ist der Anfang — das Blatt. */
    var p = el, stapel = [];
    while (p) {
      var c = win.getComputedStyle(p).backgroundColor;
      if (deckt(c)) { stapel.push(c); if (ist_deckend(c)) break; }
      p = p.parentElement;
    }
    var out = { r:255, g:255, b:255, a:1 };
    for (var i = stapel.length - 1; i >= 0; i--) {
      var n = male(stapel[i], out);
      if (n) out = n;
    }
    return out;
  }
  /* Deckend heißt: über Schwarz und über Weiß kommt dasselbe heraus. */
  function ist_deckend(farbe){
    var a = male(farbe, { r:0, g:0, b:0 }), b = male(farbe, { r:255, g:255, b:255 });
    if (!a || !b) return false;
    return Math.abs(a.r-b.r) < 2 && Math.abs(a.g-b.g) < 2 && Math.abs(a.b-b.b) < 2;
  }
  function lum(c){
    function k(v){ v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
    return 0.2126*k(c.r) + 0.7152*k(c.g) + 0.0722*k(c.b);
  }
  function kontrast(a, b){
    var l1 = lum(a), l2 = lum(b);
    return Math.round(((Math.max(l1,l2)+0.05) / (Math.min(l1,l2)+0.05)) * 100) / 100;
  }
  function rgbTxt(c){ return 'rgb(' + Math.round(c.r) + ',' + Math.round(c.g) + ',' + Math.round(c.b) + ')'; }
  function nam(el){
    var k = (typeof el.className === 'string' ? el.className : '').trim();
    return el.tagName.toLowerCase() + (el.id ? '#' + el.id : '')
         + (k ? '.' + k.split(/\s+/).slice(0, 2).join('.') : '');
  }

  /* ── Der Messkern. Gibt ein Objekt zurück, nicht Text — damit ein
        gebündelter Lauf sammeln kann, statt je Fläche einen Aufruf zu
        kosten. ─────────────────────────────────────────────────────────── */
  function messe(d, win, label){
    var body = d.body, W = win.innerWidth, H = win.innerHeight;
    var alle = [].slice.call(d.querySelectorAll('body *'));
    var r = { flaeche: label || '', vw: W, vh: H };
    r.ueberlauf = Math.max(d.documentElement.scrollWidth, body ? body.scrollWidth : 0) - W;

    /* (1) ragt heraus OHNE klippenden Vorfahren — gegen den Vorfahren
           prüfen, nicht gegen den Viewport: ein herausgescrolltes Element
           meldet seine ungescrollte Lage. */
    var raus = [], uebersprungen = 0;
    alle.forEach(function(el){
      if (gemalt(el) === false) { uebersprungen++; return; }
      var b = el.getBoundingClientRect();
      if (b.width === 0 || b.height === 0) return;
      if (b.right <= W + 1) return;
      var p = el.parentElement, klippt = false;
      while (p && p !== body) {
        var ov = win.getComputedStyle(p).overflowX;
        if (ov === 'auto' || ov === 'scroll' || ov === 'hidden') { klippt = true; break; }
        p = p.parentElement;
      }
      if (!klippt) raus.push({ t: nam(el).slice(0, 34), px: Math.round(b.right - W) });
    });
    raus.sort(function(a, b){ return b.px - a.px; });
    r.raus = raus.slice(0, 8); r.rausN = raus.length;
    r.uebersprungen = uebersprungen;

    /* (2) Scrollflächen: entweder passt der Inhalt, oder er ist wischbar.
           **Stumm** heißt: der Inhalt ist breiter, aber overflow-x lässt
           kein Wischen zu — dann wird abgeschnitten, ohne es zu sagen. Das
           ist der Befund, der zählt.

           v1901b · Die Schwelle steht auf 4 px, nicht auf 1. Bei 1 px zählte
           jede Rundung mit: `button#hdr-credits-pill` mit 110 gegen 108 und
           `div.dp-kg-panel` mit 367 gegen 364 standen als Scrollflächen in
           der Liste, und 29 der 31 Meldungen waren solche Reste.

           Der Balken wird MITGEMELDET, aber er macht eine Fläche nicht zum
           Fehler: Chrome gibt überlagernde Balken ohne reservierten Platz,
           `offsetHeight - clientHeight === 0` beweist also nichts.
           `scrollbar-width:none` schaltet ihn dagegen wirklich ab — das ist
           einen Hinweis wert, weil dann nichts anzeigt, dass es weitergeht.

           v1901c · ZWEI WEITERE SCHEINBEFUNDE, beide gemessen in der Kanzlei
           bei 390 px. Der Zähler stand auf 27 „stumm"; echt waren zwei.

           (a) `overflow-x: visible` KLIPPT NICHT. Ein solcher Behälter malt
               über seine Kante hinaus, statt abzuschneiden — ob das stört,
               beantwortet allein die Prüfung (1) gegen den ersten klippenden
               Vorfahren, und die stand auf null. Gezählt wird deshalb nur
               noch `hidden` und `clip`. (Gemessen: von 29 überbreiten
               Flächen 25 hidden, 2 auto, 2 visible.)

           (b) `label.oe-sr` × 23, jedes mit `clientWidth: 1`. Das ist das
               übliche Muster für Text, der nur dem Vorleseprogramm gilt:
               ein 1×1-Kasten mit `overflow:hidden`. Der Inhalt SOLL dort
               verschwinden. Unter 24 px Innenbreite wird deshalb nicht
               gezählt — ein Kasten dieser Größe trägt ohnehin nichts
               Sichtbares. */
    var scroll = [];
    alle.forEach(function(el){
      if (gemalt(el) === false) return;
      if (el.scrollWidth - el.clientWidth < 4) return;
      if (el.clientWidth < 24) return;                 /* sr-only und Ähnliches */
      var cs = win.getComputedStyle(el), ov = cs.overflowX;
      if (ov === 'visible') return;                    /* malt hinaus, klippt nicht */
      scroll.push({
        t: nam(el).slice(0, 30), sw: el.scrollWidth, cw: el.clientWidth, ov: ov,
        wischbar: ov === 'auto' || ov === 'scroll',
        balken: el.offsetHeight - el.clientHeight,
        sbw: cs.scrollbarWidth || 'auto'
      });
    });
    r.scroll = scroll.slice(0, 10); r.scrollN = scroll.length;
    r.stumm = scroll.filter(function(s){ return !s.wischbar; }).length;
    r.ohneBalken = scroll.filter(function(s){ return s.wischbar && s.sbw === 'none'; }).length;

    /* (3) Bedienelemente: Größe UND Treffbarkeit. Eine Fläche, die groß
           genug ist, aber unter einem Nachbarn liegt, ist nicht bedienbar —
           das sagt nur elementFromPoint. Auf dem Finger gibt es kein
           :hover, also wird nichts aufgedeckt. */
    var bed = [].slice.call(d.querySelectorAll('a,button,input,select,textarea,[role=button],[role=tab],label'));
    var klein = [], verdeckt = [], gesamt = 0, bedUeber = 0;
    bed.forEach(function(el){
      if (gemalt(el) === false) { bedUeber++; return; }
      var b = el.getBoundingClientRect();
      if (b.width === 0 || b.height === 0) { bedUeber++; return; }
      gesamt++;
      if (b.height < 40 || b.width < 40) {
        klein.push(nam(el).slice(0, 30) + ' ' + Math.round(b.width) + '×' + Math.round(b.height));
      }
      var cx = b.left + b.width/2, cy = b.top + b.height/2;
      if (cx < 0 || cy < 0 || cx > W || cy > H) return;
      var hit = d.elementFromPoint(cx, cy);
      if (!hit) { verdeckt.push(nam(el).slice(0, 26) + ' → nichts'); return; }
      if (hit !== el && !el.contains(hit) && !hit.contains(el)) {
        verdeckt.push(nam(el).slice(0, 26) + ' ' + Math.round(b.width) + '×' + Math.round(b.height)
                      + ' → ' + nam(hit).slice(0, 22));
      }
    });
    r.bedGesamt = gesamt; r.bedUeber = bedUeber;
    r.klein = klein.slice(0, 12); r.kleinN = klein.length;
    r.verdeckt = verdeckt.slice(0, 12); r.verdecktN = verdeckt.length;

    /* (3b) v1901f · IST DAS BEDIENELEMENT ÜBERHAUPT ERREICHBAR?

           `elementFromPoint` oben beantwortet nur, was im Schirm liegt. Die
           teurere Frage ist, ob ein Element, das AUSSERHALB seines
           klippenden Behälters liegt, durch Wischen noch zu erreichen ist.

           Der Weg nach oben, Schritt für Schritt — und die vier Irrtümer,
           die auf diesem Weg je einen Anlauf gekostet haben:

           · Ein Vorfahr mit `overflow-x: visible` klippt NICHT.
           · Liegt zwischen Element und Klipper ein Behälter mit `auto` oder
             `scroll`, der mehr Inhalt hat als Platz, ist alles erreichbar —
             er wird gewischt. Die sieben Partnerkarten in `#dab-rail-…`
             sahen ohne diese Regel wie acht tote Knöpfe aus.
           · Die Kante des Klippers ist SEINE Kante, nicht der Schirm. Wer
             sie auf `innerWidth` kürzt, erklärt jede Karte einer
             Querschiene für unerreichbar.
           · **Ein Behälter ohne eigene Fläche ist ZUGEKLAPPT, nicht kaputt.**
             `div.kc-body` im Cockpit ist 0 px hoch, seine Kinder sind es
             nicht — das ergab 61 Scheinbefunde. Dieselbe Familie wie das
             zugeklappte `<details>`: der Inhalt ist nicht verloren, er ist
             zu. Solche Fälle werden getrennt gezählt (`inZugeklapptem`). */
    var unerr = [], zuN = 0;
    bed.forEach(function(el){
      /* v1901g · `bed` ist die UNGEFILTERTE Liste — gefiltert wird in (3)
         erst in der Schleife. Ohne diese Zeile lief die Erreichbarkeits-
         prüfung über alles und meldete den Haken `#afa_sonder7b_aktiv` aus
         dem zugeklappten `<details>` als „geklippt von div.card": genau das
         Phantom, gegen das v1901 gebaut wurde, durch die Hintertür zurück. */
      if (gemalt(el) === false) return;
      var b = el.getBoundingClientRect();
      if (b.width === 0 || b.height === 0) return;
      var p = el.parentElement, sc = false, grund = null, fertig = false;
      while (p && p !== body && !fertig) {
        var cs2 = win.getComputedStyle(p), ox = cs2.overflowX, oy = cs2.overflowY;
        if ((ox === 'auto' || ox === 'scroll') && p.scrollWidth  > p.clientWidth  + 1) sc = true;
        if ((oy === 'auto' || oy === 'scroll') && p.scrollHeight > p.clientHeight + 1) sc = true;
        if (ox === 'hidden' || ox === 'clip' || oy === 'hidden' || oy === 'clip') {
          var pr = p.getBoundingClientRect();
          if (pr.width === 0 || pr.height === 0) { zuN++; fertig = true; break; }
          var draussen = b.left >= pr.right - 1 || b.right <= pr.left + 1
                      || b.top  >= pr.bottom - 1 || b.bottom <= pr.top + 1;
          if (draussen) {
            if (!sc) grund = nam(el).slice(0, 26) + ' — geklippt von ' + nam(p).slice(0, 24)
                   + ' [' + Math.round(pr.left) + '..' + Math.round(pr.right) + ' / '
                   + Math.round(pr.top) + '..' + Math.round(pr.bottom) + ']';
            fertig = true;
          }
        }
        p = p.parentElement;
      }
      if (!grund && !fertig && !sc) {
        var cx2 = b.left + b.width / 2;
        if (cx2 < 0 || cx2 > W) grund = nam(el).slice(0, 26) + ' — außerhalb des Schirms, kein Scroller';
      }
      if (grund) unerr.push(grund);
    });
    r.unerreichbar = unerr.slice(0, 8); r.unerreichbarN = unerr.length;
    r.inZugeklapptem = zuN;

    /* (4) Kontrast als Paar, über ALLE Texträger — nicht mit dem Auge.
           Nur eigene Textknoten, sonst zählt jeder Behälter den Text seiner
           Kinder noch einmal mit. */
    var schwach = [];
    alle.forEach(function(el){
      if (gemalt(el) === false) return;
      var txt = '';
      for (var i = 0; i < el.childNodes.length; i++) {
        if (el.childNodes[i].nodeType === 3) txt += el.childNodes[i].nodeValue;
      }
      txt = txt.trim();
      if (txt.length < 2) return;
      var b = el.getBoundingClientRect();
      if (b.width < 4 || b.height < 4) return;
      var cs = win.getComputedStyle(el);
      var grund = effGrund(el, win);
      var fg = male(cs.color, grund);     /* Text ÜBER seinem Grund gemalt */
      if (!fg) return;
      var k = kontrast(fg, grund);
      var fs = parseFloat(cs.fontSize);
      var gross = fs >= 24 || (fs >= 18.66 && +cs.fontWeight >= 700);
      if (k < (gross ? 3 : 4.5)) {
        schwach.push({ t: nam(el).slice(0, 26), txt: txt.slice(0, 20),
                       fg: rgbTxt(fg), grund: rgbTxt(grund), k: k, fs: cs.fontSize });
      }
    });
    schwach.sort(function(a, b){ return a.k - b.k; });
    r.kontrast = schwach.slice(0, 8); r.kontrastN = schwach.length;
    return r;
  }

  /* ── Darstellung eines Messobjekts ────────────────────────────────────── */
  function zeige(r){
    var t = '<h2>MESSWERTE · ' + (aktuell ? aktuell[0] : '') + '</h2>';
    var lg = lage();
    if (!lg.zielSichtbar) {
      t += '<span class="bad">FENSTER IM HINTERGRUND</span> — gefiltert wird nur über\n'
         + '              Geometrie und &lt;details&gt;; Farbwerte sind hier nicht\n'
         + '              verlässlich (eingefrorene Übergänge).\n\n';
    }
    t += 'Viewport      ' + r.vw + ' × ' + r.vh + '\n';
    t += 'Überlauf      ' + (r.ueberlauf > 1
      ? '<span class="bad">' + r.ueberlauf + ' px zu breit</span>'
      : '<span class="ok">keiner</span>') + '\n';
    t += 'Klickflächen  ' + r.bedGesamt + ', davon ' + (r.kleinN
      ? '<span class="warn">' + r.kleinN + ' unter 40 px</span>'
      : '<span class="ok">keine zu klein</span>')
      + '\n              <span class="leise">' + r.bedUeber + ' ungemalt übersprungen '
      + '(zugeklappte &lt;details&gt;, display:none)</span>\n';
    t += 'Treffbarkeit  ' + (r.verdecktN
      ? '<span class="bad">' + r.verdecktN + ' verdeckt</span>'
      : '<span class="ok">alle treffbar</span>') + '\n';
    t += 'Erreichbar    ' + (r.unerreichbarN
      ? '<span class="bad">' + r.unerreichbarN + ' geklippt ohne Wischweg</span>'
      : '<span class="ok">alle erreichbar</span>')
      + (r.inZugeklapptem ? ' <span class="leise">(' + r.inZugeklapptem + ' in Zugeklapptem)</span>' : '') + '\n';
    t += 'Scrollflächen ' + r.scrollN + (r.stumm
      ? ', <span class="bad">' + r.stumm + ' stumm (schneidet ab)</span>'
      : (r.scrollN ? ', <span class="ok">alle wischbar</span>' : ''))
      + (r.ohneBalken ? ', <span class="warn">' + r.ohneBalken + ' ohne Balken</span>' : '') + '\n';
    t += 'Kontrast      ' + (r.kontrastN
      ? '<span class="bad">' + r.kontrastN + ' Paare unter der Schwelle</span>'
      : '<span class="ok">alle Paare halten</span>') + '\n';
    if (r.raus.length) {
      t += '\n<span class="bad">RAGT HERAUS</span>\n';
      r.raus.forEach(function(x){ t += '  ' + x.t + '  +' + x.px + ' px\n'; });
      if (r.rausN > r.raus.length) t += '  … und ' + (r.rausN - r.raus.length) + ' weitere\n';
    }
    if (r.verdeckt.length) {
      t += '\n<span class="bad">VERDECKT</span>\n';
      r.verdeckt.forEach(function(x){ t += '  ' + x + '\n'; });
    }
    if (r.unerreichbar.length) {
      t += '\n<span class="bad">NICHT ERREICHBAR</span>\n';
      r.unerreichbar.forEach(function(x){ t += '  ' + x + '\n'; });
    }
    if (r.kontrast.length) {
      t += '\n<span class="bad">KONTRAST</span>\n';
      r.kontrast.forEach(function(x){
        t += '  ' + x.k + '  ' + x.t + '  „' + x.txt + '"\n        '
           + x.fg + ' auf ' + x.grund + '\n';
      });
    }
    if (r.stumm || r.ohneBalken) {
      t += '\n<span class="warn">SCROLLFLÄCHEN</span>\n';
      r.scroll.forEach(function(s){
        t += '  ' + s.t + '  ' + s.sw + '>' + s.cw
           + (s.wischbar ? '' : '  nicht wischbar')
           + (s.sbw === 'none' ? '  Balken aus' : '')
           + (s.balken === 0 ? '  kein Balkenplatz' : '') + '\n';
      });
    }
    w.innerHTML = t.replace(/\n/g, '<br>');
  }

  /* ── Harness: EIN Aufruf je Aussehen und Breite ───────────────────────── */
  function ziel(){ return { d: f.contentDocument, win: f.contentWindow }; }

  function setzeMerker(layout){
    try {
      if (layout === '' || layout === null) window.localStorage.removeItem('dp_layout');
      else window.localStorage.setItem('dp_layout', layout);
      window.localStorage.setItem('dp_layout_gewaehlt', '1');
    } catch (e) {}
  }

  function lade(breite, layout, hoehe){
    setzeMerker(layout);
    rahmen.style.width  = (breite + 2) + 'px';          /* +2 für den Rahmen */
    rahmen.style.height = Math.min(hoehe || 780, 760) + 'px';
    lbl.textContent = breite + ' px · ' + (layout === '' ? 'Heute' : layout);
    aktuell = [ (layout === '' ? 'Heute' : layout) + ' @ ' + breite, breite, hoehe || 780 ];
    return new Promise(function(fertig){
      var los = false;
      function da(){ if (los) return; los = true; warte(3600).then(fertig); }
      f.addEventListener('load', da, { once: true });
      setTimeout(da, 22000);   /* Notbremse - darf gedrosselt sein */
      f.src = ZIEL + (ZIEL.indexOf('?') >= 0 ? '&' : '?') + 'mk=' + Date.now();
    });
  }

  function schlaf(ms){ return warte(ms); }   /* v1901e: nicht gedrosselt */

  /* Über die Reiter schleifen mit einem ECHTEN Klickweg (el.click() löst das
     Ereignis aus — der Unterschied zu setAttribute, vor dem die Doktrin
     warnt, ist genau dieser). Alles in EINEM Lauf: zwölf Aufrufe statt 110. */
  async function reiterLauf(pause){
    var z = ziel(), out = [];
    var btns = [].slice.call(z.d.querySelectorAll('nav.tabs button.tab'));
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      var name = (b.getAttribute('data-tab') || b.textContent || '?').trim().slice(0, 22);
      b.click();
      await schlaf(pause || 160);
      out.push(messe(z.d, z.win, 'Reiter ' + name));
    }
    return out;
  }

  async function lauf(opt){
    opt = opt || {};
    await lade(opt.breite || 390, opt.layout === undefined ? '' : opt.layout, opt.hoehe);
    var z = ziel();
    var erg = {
      breite: opt.breite || 390,
      layout: opt.layout === undefined ? '' : opt.layout,
      gesetzt: z.d.documentElement.getAttribute('data-dp-layout'),
      iw: z.win.innerWidth,
      start: messe(z.d, z.win, 'Start')
    };
    if (opt.reiter !== false) erg.reiter = await reiterLauf(opt.warte);
    zeige(erg.start);
    return erg;
  }

  /* ── Knöpfe ───────────────────────────────────────────────────────────── */
  GERAETE.forEach(function(g, i){
    var b = document.createElement('button');
    b.textContent = g[0] + ' · ' + g[1];
    b.onclick = function(){ waehle(i); };
    document.getElementById('g').appendChild(b);
  });

  function waehle(i){
    var g = GERAETE[i];
    [].forEach.call(document.querySelectorAll('#g button'), function(b, k){
      b.className = k === i ? 'an' : '';
    });
    aktuell = g;
    rahmen.style.width  = g[1] + 'px';
    rahmen.style.height = Math.min(g[2], 760) + 'px';
    lbl.textContent = g[0] + ' — ' + g[1] + '×' + g[2];
    f.src = ZIEL + (ZIEL.indexOf('?') >= 0 ? '&' : '?') + 'mk=' + Date.now();
  }

  f.addEventListener('load', function(){ setTimeout(function(){
    var z = ziel();
    if (!z.d) { w.innerHTML = '<h2>MESSWERTE</h2><span class="bad">Kein Dokument</span>'; return; }
    try { zeige(messe(z.d, z.win, 'Start')); }
    catch (e) { w.innerHTML = '<h2>MESSWERTE</h2><span class="bad">' + e.message + '</span>'; }
  }, 2400); });

  /* Ein Prüfer, der sich nicht selbst prüft, wird irgendwann grün, ohne
     hinzusehen. `DPM.selbsttest()` malt bekannte Farben und rechnet gegen
     Werte, die von Hand nachgerechnet sind. Gold auf Obsidian ist der Fall,
     an dem der alte Parser gescheitert ist. */
  function selbsttest(){
    var w = { r:255, g:255, b:255 }, s = { r:0, g:0, b:0 };
    var f = [
      ['#C9A84C deckend',        male('#C9A84C', s),                           [201,168,76]],
      ['color(srgb) = Gold',     male('color(srgb 0.788235 0.658824 0.298039)', s), [201,168,76]],
      ['Gold 80% auf Obsidian',  male('color(srgb 0.788235 0.658824 0.298039 / 0.8)', { r:42,g:39,b:39 }), [169,142,69]],
      ['rgba halb auf Weiß',     male('rgba(0,0,0,0.5)', w),                   [128,128,128]]
    ];
    var zeilen = f.map(function(x){
      var got = x[1], soll = x[2];
      var ok = got && Math.abs(got.r-soll[0])<=2 && Math.abs(got.g-soll[1])<=2 && Math.abs(got.b-soll[2])<=2;
      return (ok ? 'ok   ' : 'FEHL ') + x[0] + '  ' + (got ? got.r+','+got.g+','+got.b : 'null')
             + '  soll ' + soll.join(',');
    });
    /* Kontrast Weiß gegen Schwarz muss 21 sein, Weiß gegen Weiß 1. */
    zeilen.push((kontrast(w, s) === 21 ? 'ok   ' : 'FEHL ') + 'Kontrast Weiß/Schwarz = ' + kontrast(w, s));
    zeilen.push((kontrast(w, w) === 1 ? 'ok   ' : 'FEHL ') + 'Kontrast Weiß/Weiß = ' + kontrast(w, w));
    return zeilen;
  }

  window.DPM = { messe: messe, zeige: zeige, lade: lade, lauf: lauf,
                 reiterLauf: reiterLauf, ziel: ziel, effGrund: effGrund,
                 kontrast: kontrast, gemalt: gemalt, male: male,
                 lage: lage, warte: warte,
                 selbsttest: selbsttest, geraete: GERAETE };

  waehle(2);   /* iPhone 14 */
})();
</script>
