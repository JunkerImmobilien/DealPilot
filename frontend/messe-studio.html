#zeile b{color:var(--gh);font-weight:600}
#txt.wechsel{animation:bandWechsel .55s cubic-bezier(.2,.8,.2,1)}
@keyframes bandWechsel{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
#nr.wechsel{animation:nrWechsel .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes nrWechsel{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}

#start{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--obs);text-align:center}

    txt.classList.remove('wechsel'); void txt.offsetWidth; txt.classList.add('wechsel');

  }

  var _laeuft = false;
  async function ablauf() {
    if (_laeuft) return; _laeuft = true;
    document.getElementById('start').hidden = true;

  });
  async function ende() {

  });
  document.getElementById('los').onclick = ablauf;
