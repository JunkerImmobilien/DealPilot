<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DealPilot</title>
<!--
  DealPilot v1118 — die MA-Fassung ist ausgebaut.

  Diese Seite ist keine App mehr, sondern eine Umleitung mit Aufraeumauftrag.
  Sie bleibt bewusst erreichbar, statt geloescht zu werden:

  1. Installierte Handy-Apps starten auf /mobile-demo.html. Waere die Datei
     weg, stuenden sie vor einem 404 statt vor der App.
  2. Der alte Service Worker (Geltungsbereich /mobile-demo.html) liegt auf dem
     GERAET. Er wird nur abgeraeumt, wenn das Geraet die Seite noch erreicht.
     Deshalb meldet diese Seite ihn ab, bevor sie weiterschickt.

  Die Gestaltungsvorlage der alten Fassung liegt als
  design/mockups/dp-handy-mockup-ma.html — sie war Marcels Bildvorlage fuer
  mehrere Umbauten und ist nicht verloren.

  Wenn diese Datei irgendwann faellt, faellt sie zusammen mit
  dp-mobile-sw.js — nicht vorher.
-->
<link rel="manifest" href="/dp-mobile.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="/assets/dp-pwa-192.png">
<link rel="icon" type="image/png" href="/assets/dp-pwa-192.png">
<style>
  html,body{margin:0;height:100%}
  body{background:radial-gradient(120% 90% at 50% 0%,#151310,#050505 70%);
    color:#FDFCFA;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:32px 26px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif}
  .wm{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.4px}
  .wm b{color:var(--wl-c9a84c, #C9A84C);font-weight:700}
  .rw{height:3px;width:64px;margin:14px auto 22px;border-radius:2px;
    background:linear-gradient(110deg,var(--wl-e8cc7a, #E8CC7A),var(--wl-c9a84c, #C9A84C) 55%,var(--wl-b8932f, #b8932f))}
  p{font-size:14.5px;line-height:1.6;color:#b5b0a4;margin:0;max-width:310px}
  a{color:var(--wl-e8cc7a, #E8CC7A);margin-top:22px;font-size:13px}
</style>
</head>
<body>
<div class="wm">Deal<b>Pilot</b></div>
<div class="rw"></div>
<p>Einen Moment — DealPilot &ouml;ffnet sich.</p>
<a href="/">Weiter zu DealPilot</a>
<script>
/* v1118-ma-ausbau: erst abraeumen, dann weiterleiten. Die Weiterleitung
   laeuft in jedem Fall — auch wenn das Abraeumen scheitert oder haengt. */
(function () {
  var weg = false;
  function weiter() {
    if (weg) return; weg = true;
    try { location.replace('/'); } catch (e) { location.href = '/'; }
  }
  /* Notbremse: was auch immer passiert, nach 2,5 s geht es weiter. */
  setTimeout(weiter, 2500);

  var jobs = [];
  try {
    if ('serviceWorker' in navigator) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    }
  } catch (e) {}
  try {
    if (window.caches && caches.keys) {
      jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }));
    }
  } catch (e) {}

  if (!jobs.length) { weiter(); return; }
  Promise.all(jobs).then(weiter, weiter);
})();
</script>
</body>
</html>
